<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
  
  <title>Frontend Mentor | Tip calculator app</title>

</head>
<body>
  <header>
    <h1>SPLI</h1>
    <h1>TTER</h1>
  </header>

  <main>

    <form novalidate>
      
      <div>
      <label for="bill">Bill</label>
      <div class="bill-input_container">
      <img src="images/icon-dollar.svg">

      <input type="number" name="bill" id="bill" placeholder="0">
      </div>
      </div>
      
      <div>
      <label for="tip">Select Tip %</label>
      <div class="tip-buttons_container">
        <button type="submit" data-tip="5">5%</button>
        <button type="submit" data-tip="10">10%</button>
        <button type="submit" data-tip="15">15%</button>
        <button type="submit" data-tip="25">25%</button>
        <button type="submit" data-tip="50">50%</button>
        <input type="number" name="tip" id="customAmount" placeholder="Custom">
      </div>
      </div>
      

      <div>
      <div class="label__container">
        <label for="people"> Number of People?</label>
        <p id="peopleInputError">Can't be zero</p>
      </div>
      <div class="peopleInput_container">
       <img src="images/icon-person.svg">
       <input type="number" name="people" id="people" placeholder="0">
      </div>

      </div>
    </form>

    <section class="summary">
      <div class="summary-container">   
        <div class="tip__amount">
         <div>
          <p>Tip Amount</p>
          <span>/ person</span>
          </div>

          <p id="tipAmount">$0.00</p>
        </div>

        <div class="total">
          <div>
          <p>Total</p>
          <span> / person</span>
          </div>
          <p id="total">$0.00</p>
        </div>
      </div>

      <button id="resetBtn">RESET</button>

    </section>
    
  </main>

  </footer> -->
</body>
</html>
