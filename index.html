<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="stylesheet" href="style.css">
  <script defer src="script.js"></script>
  
  <title>Frontend Mentor | Tip calculator app</title>

</head>
<body>
  <header>
    <h1>SPLI</h1>
    <h1>TTER</h1>
  </header>

  <main>
    <form novalidate>

      <label for="bill">Bill</label>
      <input type="number" name="bill" id="bill">
      
      <label for="tip">Select Tip %</label>
      <div class="tip-buttons">
        <button type="submit" data-tip="5">5%</button>
        <button type="submit" data-tip="10">10%</button>
        <button type="submit" data-tip="15">15%</button>
        <button type="submit" data-tip="25">25%</button>
        <button type="submit" data-tip="50">50%</button>
        <input type="number" name="tip" id="customAmount" placeholder="Custom">
      </div>
      
      <label for="people"> Number of People?</label>
      <input type="number" name="people" id="people">
    </form>

    <section class="summary">
      <div class="tip__amount">
        <p>Tip Amount / person</p>
        <p id="tipAmount"></p>
      </div>
      <div class="total">
        <p>Total / person</p>
        <p id="total"></p>
      </div>

      <button id="resetBtn">Reset</button>

    </section>
    
  </main>

  </footer> -->
</body>
</html>
